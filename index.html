  <!-- Idioma: se resuelve antes del primer pintado para evitar el parpadeo de lang -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('cga:lang');
        var lang = saved === 'en' || saved === 'es' ? saved : (navigator.language || '').toLowerCase().indexOf('en') === 0 ? 'en' : 'es';
        document.documentElement.lang = lang;
        document.documentElement.setAttribute('data-lang', lang);
      } catch (e) {}
    })();
  </script>
